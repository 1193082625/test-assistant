[project]
name = "test-assistant"
version = "0.6.2"
description = "LLM 驱动的智能测试工具"
authors = [
    {name = "xibao",email = "1193082625@qq.com"}
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "click (>=8.4.2,<9.0.0)",
    "langchain-core (>=1.4.8,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "langchain (>=1.3.13,<2.0.0)",
    "langchain-openai (>=1.3.5,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "langgraph (>=1.2.9,<2.0.0)",
    "langsmith (>=0.10.5,<0.11.0)"
]

[project.scripts]
test-assistant = "cli.main:cli"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "cli" },
    { include = "core" },
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "performance: deterministic CI-scale performance and memory checks",
    "large_performance: fixed-machine large profile excluded by default",
]
