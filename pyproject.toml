[project]
name = "test-assistant"
version = "0.7.0"
description = "LLM 驱动的智能测试工具"
authors = [
    {name = "xibao",email = "1193082625@qq.com"}
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "click (>=8.4.2,<9.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
]

[project.optional-dependencies]
llm = [
    "langchain-core (>=1.4.8,<2.0.0)",
    "langchain-openai (>=1.3.5,<2.0.0)",
    "langgraph (>=1.2.9,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
]
quality = [
    "pytest-cov (>=7.0.0,<8.0.0)",
    "coverage (>=7.0.0,<8.0.0)",
    "ruff (>=0.12.0,<1.0.0)",
    "mypy (>=1.18.0,<2.0.0)",
]
all = [
    "langchain-core (>=1.4.8,<2.0.0)",
    "langchain-openai (>=1.3.5,<2.0.0)",
    "langgraph (>=1.2.9,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "coverage (>=7.0.0,<8.0.0)",
    "ruff (>=0.12.0,<1.0.0)",
    "mypy (>=1.18.0,<2.0.0)",
]

[project.scripts]
test-assistant = "cli.main:cli"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "cli" },
    { include = "core" },
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "langgraph (>=1.2.9,<2.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "performance: deterministic CI-scale performance and memory checks",
    "large_performance: fixed-machine large profile excluded by default",
]
