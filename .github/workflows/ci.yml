name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Check generated compatibility table
        run: poetry run python scripts/generate_compatibility_table.py --check
      - name: Run tests
        run: poetry run pytest -q

  performance-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Verify performance adapters
        run: poetry run pytest tests/performance -m performance -q
      - name: Run CI performance profile
        run: poetry run python scripts/run_benchmarks.py --profile ci --json

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pipx install poetry
      - name: Build distributions
        run: poetry build
      - name: Upload immutable distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  wheel-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        installation:
          - base
          - llm
          - quality
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Smoke test installed wheel
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="${RUNNER_TEMP}/test-assistant-wheel-smoke-${{ matrix.installation }}"
          smoke_venv="${smoke_root}/venv"
          smoke_project="${smoke_root}/fixture with spaces 中文"
          wheel_path="$(find dist -name '*.whl' -print -quit)"
          install_target="$wheel_path"
          if [ "${{ matrix.installation }}" != "base" ]; then
            install_target="${wheel_path}[${{ matrix.installation }}]"
          fi
          python -m venv "$smoke_venv"
          if [ "${{ matrix.installation }}" = "base" ]; then
            "$smoke_venv/bin/pip" install "click>=8.4.2,<9.0.0" "pyyaml>=6.0.3,<7.0.0" "pytest==9.1.1"
            "$smoke_venv/bin/pip" install --no-deps "$wheel_path"
          else
            "$smoke_venv/bin/pip" install "$install_target" "pytest==9.1.1"
          fi
          mkdir -p "$smoke_project"
          echo 'value = 1' > "$smoke_project/app.py"
          "$smoke_venv/bin/test-assistant" --version | grep '0.7.0'
          "$smoke_venv/bin/test-assistant" doctor --help
          "$smoke_venv/bin/test-assistant" triage --help
          "$smoke_venv/bin/test-assistant" plan list --help
          "$smoke_venv/bin/test-assistant" generate --help
          "$smoke_venv/bin/test-assistant" run --help
          import_path="$(cd "$smoke_root" && "$smoke_venv/bin/python" -c 'import cli; print(cli.__file__)')"
          case "$import_path" in
            "$smoke_venv"/*) ;;
            *) echo "wheel import escaped venv: $import_path" >&2; exit 1 ;;
          esac
          find "$smoke_project" -print | sort > "$smoke_root/before-paths.txt"
          find "$smoke_project" -type f -exec shasum -a 256 {} \; | sort > "$smoke_root/before-files.txt"
          "$smoke_venv/bin/test-assistant" doctor --path "$smoke_project"
          "$smoke_venv/bin/test-assistant" doctor --path "$smoke_project" --json > "$smoke_root/doctor.json"
          "$smoke_venv/bin/python" -m json.tool "$smoke_root/doctor.json" > /dev/null
          "$smoke_venv/bin/python" -c 'import json,sys; data=json.load(open(sys.argv[1])); assert data["schema_version"] == 1 and data["status"] == "healthy"' "$smoke_root/doctor.json"
          find "$smoke_project" -print | sort > "$smoke_root/after-paths.txt"
          find "$smoke_project" -type f -exec shasum -a 256 {} \; | sort > "$smoke_root/after-files.txt"
          diff -u "$smoke_root/before-paths.txt" "$smoke_root/after-paths.txt"
          diff -u "$smoke_root/before-files.txt" "$smoke_root/after-files.txt"
          test ! -e "$smoke_project/.autotest"

          if [ "${{ matrix.installation }}" = "base" ]; then
            set +e
            "$smoke_venv/bin/test-assistant" run --path "$smoke_project" > "$smoke_root/missing-extra.txt" 2>&1
            missing_status=$?
            set -e
            test "$missing_status" -eq 2
            grep "llm_extra_required" "$smoke_root/missing-extra.txt"
          elif [ "${{ matrix.installation }}" = "llm" ]; then
            "$smoke_venv/bin/python" -c 'from core.llm.client import LLMClient; from core.graphs.run_graph import run_graph'
          else
            "$smoke_venv/bin/python" -c 'import json,sys; data=json.load(open(sys.argv[1])); checks={item["name"]: item["state"] for item in data["checks"]}; assert all(checks[name] == "available" for name in ("pytest-cov", "coverage", "ruff", "mypy"))' "$smoke_root/doctor.json"
          fi

  python-314-probe:
    needs: build
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Probe unsupported Python with Doctor
        shell: bash
        run: |
          set -euo pipefail
          probe_root="${RUNNER_TEMP}/test-assistant-python-314"
          python -m venv "$probe_root/venv"
          "$probe_root/venv/bin/pip" install --ignore-requires-python dist/*.whl "pytest==9.1.1"
          mkdir -p "$probe_root/fixture"
          set +e
          "$probe_root/venv/bin/test-assistant" doctor --path "$probe_root/fixture" --json > "$probe_root/doctor.json"
          doctor_status=$?
          set -e
          test "$doctor_status" -eq 1
          "$probe_root/venv/bin/python" -c 'import json,sys; data=json.load(open(sys.argv[1])); python_check=next(item for item in data["checks"] if item["name"] == "python"); assert data["status"] == "incompatible" and python_check["reason"] == "unsupported_python_version"' "$probe_root/doctor.json"
